name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.1.0" "cmake;3.31.6" "ndk;28.0.13004108"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install extra-cmake-modules gettext

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: false

      - name: Build Debug APK
        run: |
          sed -i 's/\r//' gradlew gradlew.bat
          bash gradlew :app:assembleDebug -PbuildABI=arm64-v8a

      - name: Debug build output
        run: |
          echo "=== ls app/build ==="
          ls -la app/build/ 2>/dev/null || echo "app/build/ does not exist"
          echo "=== ls app/build/outputs ==="
          ls -laR app/build/outputs/ 2>/dev/null || echo "app/build/outputs/ does not exist"
          echo "=== Any APK anywhere ==="
          find / -name "*.apk" -type f 2>/dev/null | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: "**/*.apk"
          if-no-files-found: error
